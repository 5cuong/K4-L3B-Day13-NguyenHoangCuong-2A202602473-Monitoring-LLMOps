alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602473
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: request_failed / request_received > 2%
    duration: 2m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602473
    runbook: docs/alerts.md#alert-2
  - name: DegradedAnswerQuality
    severity: warning
    condition: mean(response_sent.quality_score) < 0.75 OR retrieval tool_success rate < 90%
    duration: 10m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602473
    runbook: docs/alerts.md#alert-3
